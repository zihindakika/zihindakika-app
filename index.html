<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZihinDakika" />
  <meta name="theme-color" content="#07090d" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest?v=3.0.0" />
  <link rel="stylesheet" href="./styles.css?v=3.0.0" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <title>ZihinDakika</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brandline">
        <img src="./icons/icon-192.png" class="avatar" alt="ZihinDakika" />
        <div><div class="eyebrow">TELEFON OTOMASYONU</div><h1>ZihinDakika</h1></div>
      </div>
      <span id="statusDot" class="status-dot" aria-label="Bağlantı durumu"></span>
    </header>

    <section class="card schedule-card">
      <div class="eyebrow">GÜNLÜK PLAN</div>
      <div class="slot-row">
        <div><b>17:30</b><span>17:15 onay</span></div>
        <div><b>20:30</b><span>20:15 onay</span></div>
      </div>
      <p id="statusText">Günün içeriği yükleniyor…</p>
    </section>

    <section class="card content-card">
      <div class="content-top">
        <span id="slotBadge" class="badge">HAZIRLANIYOR</span>
        <span id="updatedAt" class="muted"></span>
      </div>
      <h2 id="contentTitle">Yeni ZihinDakika içeriği</h2>
      <p id="contentHook" class="hook">Video hazır olduğunda burada görünecek.</p>
      <div class="quality-row">
        <span id="durationBadge">— sn</span><span>1080×1920</span><span id="voiceBadge">Türkçe AI ses</span>
      </div>
      <div id="previewBox" class="preview-box hidden">
        <video id="video" playsinline controls preload="metadata"></video>
      </div>
    </section>

    <section class="controls" aria-label="Ana kontroller">
      <button id="previewBtn" class="action preview" type="button">▶️ <span>Video Önizle</span></button>
      <button id="shareBtn" class="action share" type="button">✅ <span>Paylaş</span></button>
      <button id="skipBtn" class="action skip" type="button">❌ <span>Paylaşma</span></button>
      <button id="createBtn" class="action create" type="button">✨ <span>İçerik Oluştur</span></button>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
    <p class="privacy">Şifre veya API anahtarı bu telefonda saklanmaz.</p>
  </main>
  <script src="./config.js?v=3.0.0"></script>
  <script src="./app.js?v=3.0.0" defer></script>
</body>
</html>
