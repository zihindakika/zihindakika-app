name: ZihinDakika Bootstrap
on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ZihinDakika
        shell: bash
        run: |
          python - <<'PY'
          import base64, tarfile, io
          data = ''''''
          raw = base64.b64decode(data)
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:gz") as tf:
              tf.extractall(".")
          PY
      - name: Commit project
        run: |
          git config user.name "ZihinDakika Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Install ZihinDakika iPhone Cloud"
          git push
