name: Install-ZihinDakika

on:
push:
paths:
- zihindakika-install.zip
- .github/workflows/bootstrap.yml

permissions:
contents: write

jobs:
install:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- run: |
test -f zihindakika-install.zip || exit 0
unzip -o zihindakika-install.zip
rm zihindakika-install.zip
git config user.name ZihinDakika-Bot
git config user.email actions@users.noreply.github.com
git add .
git commit -m Install-ZihinDakika
git push
