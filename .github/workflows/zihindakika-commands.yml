name: ZihinDakika-Commands

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  decision:
    if: >
      github.event.issue.title == 'ZD_COMMAND: APPROVE' ||
      github.event.issue.title == 'ZD_COMMAND: REJECT'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Save decision
        env:
          ZD_COMMAND: ${{ contains(github.event.issue.title, 'APPROVE') && 'APPROVE' || 'REJECT' }}
        run: python scripts/decision.py

      - name: Publish approved video through Buffer
        if: contains(github.event.issue.title, 'APPROVE')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/latest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='Onaylandı • Buffer bağlantısı bekleniyor'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          else
            python scripts/buffer_publish.py
          fi

      - name: Commit decision
        run: |
          git config user.name ZihinDakika-Bot
          git config user.email actions@users.noreply.github.com
          git add data/latest.json
          git diff --cached --quiet || git commit -m ZihinDakika-Decision
          git push origin HEAD:main

      - name: Close command issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
