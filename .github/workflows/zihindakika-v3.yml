name: ZihinDakika-V3

on:
  push:
    paths:
      - .github/workflows/zihindakika-v3.yml
  schedule:
    - cron: "55 13 * * *"
    - cron: "55 16 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Video slot
        required: false
        default: extra
        type: choice
        options:
          - extra
          - 17:30
          - 20:30
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: zihindakika-v3-production
  cancel-in-progress: false

env:
  ZD_LLM_MODEL: qwen2.5:3b

jobs:
  generate:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.title == 'ZD_COMMAND: CREATE_EXTRA')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install or refresh ZihinDakika V3 core
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import base64, tarfile, io
          DATA = ""
          raw = base64.b64decode(DATA)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
              tf.extractall('.')
          print('ZihinDakika V3 core restored')
          PY
          rm -f icon.svg
          git rm -f --ignore-unmatch media/latest.mp4 || true

      - name: Resolve publication slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "55 13 * * *" ]; then
              SLOT="17:30"
            else
              SLOT="20:30"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            SLOT="extra"
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $SLOT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache AI and voice models
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/huggingface
            ~/.cache/zihindakika
            ~/.cache/pip
          key: zihindakika-v3-models-${{ runner.os }}-1

      - name: Install video and base voice tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl git libsndfile1
          python -m pip install --quiet --disable-pip-version-check pillow piper-tts==1.7.0

      - name: Start local content AI
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull "$ZD_LLM_MODEL" || true

      - name: Generate and quality-check content
        env:
          ZD_SLOT: ${{ steps.slot.outputs.slot }}
        run: python scripts/content.py

      - name: Generate premium Turkish voice with safe fallback
        id: voice
        shell: bash
        run: |
          set +e
          rm -f build/voice_raw.wav
          FREYA_OK=0
          rm -rf /tmp/FreyaTTS
          if git clone --quiet https://github.com/freyavoiceai/FreyaTTS.git /tmp/FreyaTTS; then
            cd /tmp/FreyaTTS
            git checkout --quiet 146d36c1cb6660646be57d31339db4eed9315de3
            if python -m pip install --quiet --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu \
              && python -m pip install --quiet --disable-pip-version-check -r requirements.txt; then
              cd "$GITHUB_WORKSPACE"
              FREYA_DIR=/tmp/FreyaTTS python scripts/tts_freya.py
              if [ $? -eq 0 ] && [ -s build/voice_raw.wav ]; then
                FREYA_OK=1
                echo "FreyaTTS-small • 48 kHz" > build/voice_engine.txt
              fi
            else
              cd "$GITHUB_WORKSPACE"
            fi
          fi
          cd "$GITHUB_WORKSPACE"

          if [ "$FREYA_OK" -ne 1 ]; then
            echo "FreyaTTS kullanılamadı; güvenli Piper yedeğine geçiliyor."
            mkdir -p "$HOME/.cache/zihindakika/piper"
            MODEL="$HOME/.cache/zihindakika/piper/tr_TR-fettah-medium.onnx"
            CFG="$MODEL.json"
            if [ ! -s "$MODEL" ]; then
              curl -fL --retry 3 -o "$MODEL" "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/tr/tr_TR/fettah/medium/tr_TR-fettah-medium.onnx?download=true"
            fi
            if [ ! -s "$CFG" ]; then
              curl -fL --retry 3 -o "$CFG" "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/tr/tr_TR/fettah/medium/tr_TR-fettah-medium.onnx.json?download=true"
            fi
            cat build/narration.txt | piper --model "$MODEL" --config "$CFG" --output_file build/voice_raw.wav
            echo "Piper Fettah • kalite yedeği" > build/voice_engine.txt
          fi
          test -s build/voice_raw.wav

      - name: Master narration audio and normalize pacing
        shell: bash
        run: |
          RAW_DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/voice_raw.wav)
          TEMPO=$(python - "$RAW_DUR" <<'PY'
          import sys
          d=float(sys.argv[1]); factor=d/42.0
          factor=max(0.85,min(1.20,factor))
          print(f'{factor:.5f}')
          PY
          )
          echo "Raw duration: $RAW_DUR • atempo: $TEMPO"
          ffmpeg -hide_banner -loglevel error -y \
            -i build/voice_raw.wav \
            -af "atempo=$TEMPO,highpass=f=70,lowpass=f=15000,acompressor=threshold=-18dB:ratio=2.2:attack=20:release=250:makeup=2dB,loudnorm=I=-16:TP=-1.5:LRA=7,aresample=48000" \
            build/voice_mastered.wav
          test -s build/voice_mastered.wav

      - name: Render premium vertical video
        run: python scripts/render.py

      - name: Verify video, audio and duration
        shell: bash
        run: |
          test -s media/latest.mp4
          DIM=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 media/latest.mp4)
          [ "$DIM" = "1080x1920" ]
          ACODEC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 media/latest.mp4)
          [ "$ACODEC" = "aac" ]
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 media/latest.mp4)
          python - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 34 <= d <= 52, f'Unexpected duration: {d}'
          print('Verified duration:', round(d,2))
          PY

      - name: Commit V3 app state to main
        shell: bash
        run: |
          git config user.name ZihinDakika-Bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "ZihinDakika V3 - prepare video"

      - name: Publish only latest binary to media branch
        shell: bash
        run: |
          cp media/latest.mp4 /tmp/zihindakika-latest.mp4
          git checkout --orphan media-stage
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/zihindakika-latest.mp4 latest.mp4
          git add latest.mp4
          git commit -m "ZihinDakika latest video"
          git push --force origin HEAD:media
          git checkout -f main
          git push origin main

      - name: Close extra-content command
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })

  decision:
    if: >
      github.event_name == 'issues' &&
      (startsWith(github.event.issue.title, 'ZD_COMMAND: APPROVE:') ||
       startsWith(github.event.issue.title, 'ZD_COMMAND: REJECT:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse and validate mobile decision
        id: decision
        shell: bash
        run: |
          TITLE='${{ github.event.issue.title }}'
          if [[ "$TITLE" == ZD_COMMAND:\ APPROVE:* ]]; then CMD=APPROVE; else CMD=REJECT; fi
          EXPECTED="${TITLE##*:}"
          RESULT=$(ZD_COMMAND="$CMD" ZD_EXPECTED_ID="$EXPECTED" python scripts/decision.py | tail -n 1)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Decision result: $RESULT"

      - name: Publish approved video through Buffer
        id: buffer
        if: steps.decision.outputs.result == 'approved'
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            python - <<'PY'
          from pathlib import Path
          import json,datetime
          p=Path('data/latest.json');d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='Onaylandı • Buffer API anahtarı bekleniyor'
          d['updated_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          else
            python scripts/buffer_publish.py
          fi

      - name: Save decision state
        if: always()
        shell: bash
        run: |
          git config user.name ZihinDakika-Bot
          git config user.email actions@users.noreply.github.com
          git add data/latest.json
          git diff --cached --quiet || git commit -m "ZihinDakika V3 - mobile decision"
          git push origin main

      - name: Close decision command
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
