name: ZihinDakika-Render-v2

on:
  push:
    paths:
      - .github/workflows/zihindakika-render-v2.yml
  schedule:
    - cron: "55 13 * * *"
    - cron: "55 16 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Video slot
        required: false
        default: extra
        type: choice
        options:
          - extra
          - 17:30
          - 20:30
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  generate:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.title == 'ZD_COMMAND: CREATE_EXTRA')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "issues" ] || [ "${{ github.event_name }}" = "push" ]; then
            SLOT=extra
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            SLOT=auto
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Cache AI models
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            .cache/piper
          key: zihindakika-render-models-v1
          save-always: true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          python -m pip install --quiet pillow piper-tts==1.7.0

          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          sleep 3
          ollama pull qwen2.5:1.5b || true

          mkdir -p .cache/piper
          if [ ! -s .cache/piper/tr_TR-fettah-medium.onnx ]; then
            curl -fL --retry 3 \
              -o .cache/piper/tr_TR-fettah-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/tr/tr_TR/fettah/medium/tr_TR-fettah-medium.onnx?download=true"
          fi
          if [ ! -s .cache/piper/tr_TR-fettah-medium.onnx.json ]; then
            curl -fL --retry 3 \
              -o .cache/piper/tr_TR-fettah-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/tr/tr_TR/fettah/medium/tr_TR-fettah-medium.onnx.json?download=true"
          fi

          python - <<'PY'
          import json, os
          model='.cache/piper/tr_TR-fettah-medium.onnx'
          cfg=model+'.json'
          assert os.path.getsize(model) > 1000000, 'Piper model download failed'
          assert os.path.getsize(cfg) > 1000, 'Piper config download failed'
          json.load(open(cfg, encoding='utf-8'))
          print('Piper Turkish voice OK')
          PY

      - name: Generate content
        env:
          ZD_SLOT: ${{ steps.slot.outputs.slot }}
        run: python scripts/content.py

      - name: Generate Turkish voice
        run: |
          cat build/narration.txt | piper \
            --model .cache/piper/tr_TR-fettah-medium.onnx \
            --output_file build/voice.wav
          test -s build/voice.wav

      - name: Render 1080x1920 video
        run: python scripts/render.py

      - name: Verify output
        run: |
          test -s media/latest.mp4
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 media/latest.mp4 | grep -q '^1080x1920$'

      - name: Save latest video
        run: |
          git config user.name ZihinDakika-Bot
          git config user.email actions@users.noreply.github.com
          git add data/latest.json media/latest.mp4
          git diff --cached --quiet || git commit -m ZihinDakika-Prepare-Video
          git push origin HEAD:main

      - name: Close extra-content command
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
